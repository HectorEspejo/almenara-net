[package]
name = "almenara"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
description = "Monitor de red en TUI para Linux: descubre los equipos de la red local, pone nombre al tráfico y guarda su histórico (rollups, eventos y presencia)"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
futures = "0.3"
hickory-proto = { version = "0.26", features = ["mdns"] }
hkdf = "0.12"
maxminddb = "0.26"
libc = "0.2"
psl = "2"
nix = { version = "0.31", features = ["socket", "poll", "net", "fs", "time"] }
ouidb = { package = "macaddr-ouidb", version = "0.3.1", default-features = false, features = ["std"] }
pnet = "0.35"
aes = "0.8"
aes-gcm = "0.10"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
default = []
# Replay de ficheros pcap (F7). En Fase 3 la feature existe pero está desactivada y
# solo los tests condicionales de replay la usan; no añade dependencias.
pcap = []

[dev-dependencies]
tempfile = "3"