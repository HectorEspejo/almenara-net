# Catálogo de apps y categorías de Almenara (Fase 4, §7.9 del informe).
#
# Este fichero va embebido en el binario (include_str! en src/inference/catalog.rs).
# El apps.toml del usuario (~/.config/almenara/apps.toml) usa la misma estructura:
# una app con la misma "key" que una embebida la sustituye entera y una key nueva
# se añade. Cada app embebida lleva un comentario "# origen:" con la procedencia
# de la regla. Curación propia de Almenara (2026-11): no se copian listas públicas
# de bloqueo ni de rastreo. Los dominios compartidos por varios servicios de un
# proveedor (googleapis.com, gstatic.com, akamaized.net, cloudfront.net...) viven
# en las apps genéricas de proveedor o CDN de la categoría "infrastructure".
#
# Formato:
#   [[category]]  key, name, short
#   [[app]]       key, name, category, domains, asn, ports, "# origen: ..."
# Los dominios casan consigo mismos y con sus subdominios; gana el sufijo más
# largo (music.youtube.com → YouTube Music antes que youtube.com → YouTube).

[[category]]
key = "streaming"
name = "Vídeo y streaming"
short = "Vídeo"

[[category]]
key = "music"
name = "Música y audio"
short = "Música"

[[category]]
key = "social"
name = "Redes sociales"
short = "Social"

[[category]]
key = "messaging"
name = "Mensajería"
short = "Mensajería"

[[category]]
key = "calls"
name = "Videollamadas"
short = "Llamadas"

[[category]]
key = "games"
name = "Juegos"
short = "Juegos"

[[category]]
key = "system"
name = "Sistema y actualizaciones"
short = "Sistema"

[[category]]
key = "cloud"
name = "Nube y copias"
short = "Nube"

[[category]]
key = "work"
name = "Trabajo y desarrollo"
short = "Trabajo"

[[category]]
key = "web"
name = "Navegación, compras y banca"
short = "Web"

[[category]]
key = "tracking"
name = "Publicidad, rastreo y telemetría"
short = "Rastreo"

[[category]]
key = "infrastructure"
name = "Infraestructura"
short = "Infraestr."

[[category]]
key = "lan"
name = "Red local (especial: servicios de F2)"
short = "Red local"

